name: CrickX Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crickx-release-gate
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - run: npm test --workspace @fantasy-cricket/api -- --runInBand

  contract-tests:
    name: Smart contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test

  mobile-typecheck:
    name: Android/React Native typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - run: npm run typecheck --workspace @fantasy-cricket/mobile

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm audit --audit-level=moderate

  api-build:
    name: API production build
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root --no-audit --no-fund
      - run: npm run build --workspace @fantasy-cricket/api

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Build web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_POLYGON_RPC_URL: ${{ secrets.NEXT_PUBLIC_POLYGON_RPC_URL }}
          NEXT_PUBLIC_CRX_TOKEN_ADDRESS: ${{ secrets.NEXT_PUBLIC_CRX_TOKEN_ADDRESS }}
          NEXT_PUBLIC_CRX_CONTEST_POOL_ADDRESS: ${{ secrets.NEXT_PUBLIC_CRX_CONTEST_POOL_ADDRESS }}
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
        run: npm run build --workspace @fantasy-cricket/web
