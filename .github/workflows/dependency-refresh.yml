name: Security Dependency Refresh

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "apps/api/package.json"
      - "apps/web/package.json"
      - "apps/mobile/package.json"
      - ".github/workflows/dependency-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

# One controlled refresh is started by the security bootstrap commit.

concurrency:
  group: security-dependency-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --workspaces --include-workspace-root
          cd apps/mobile
          npx expo install --fix
          cd ../..
          npm install --workspaces --include-workspace-root
          npm audit fix --package-lock-only --force || true

      - name: Verify install and security audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --workspaces --include-workspace-root
          set +e
          npm audit --omit=dev --audit-level=moderate
          audit_status=$?
          set -e
          echo "Dependency audit exit status: $audit_status"
          npm run build --workspace @fantasy-cricket/api
          npm run build --workspace @fantasy-cricket/web

      - name: Commit refreshed dependency tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/api/package.json apps/web/package.json apps/mobile/package.json
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 0
          fi
          git commit -m "chore(security): refresh dependency tree"
          git push

