name: CrickX Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: crickx-security
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Audit API production dependencies
        run: npm audit --workspace @fantasy-cricket/api --omit=dev --audit-level=moderate
      - name: Audit web production dependencies
        run: npm audit --workspace @fantasy-cricket/web --omit=dev --audit-level=moderate
      - name: Report mobile dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --workspace @fantasy-cricket/mobile --audit-level=moderate
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Mobile Expo/React Native dependency advisories are reported above. The current upstream braces/node-forge advisories have no patched package release yet; they are not being treated as resolved."
          fi
          exit 0

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v4
