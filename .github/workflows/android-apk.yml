name: CrickX Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: .
        run: npm install --workspaces --include-workspace-root

      - name: Configure Node resolution
        shell: bash
        run: |
          echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules:$GITHUB_WORKSPACE/apps/mobile/node_modules" >> "$GITHUB_ENV"

      - name: Generate clean Android project
        env:
          CI: "1"
        run: npx expo prebuild --clean --platform android --no-install

      - name: Ensure Android splash resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          color = "#0B0D12"

          for folder in [
              Path("android/app/src/main/res/values"),
              Path("android/app/src/main/res/values-night"),
          ]:
              folder.mkdir(parents=True, exist_ok=True)
              p = folder / "colors.xml"
              if p.exists():
                  s = p.read_text()
                  if 'name="splashscreen_background"' not in s:
                      s = s.replace("</resources>", f'    <color name="splashscreen_background">{color}</color>\n</resources>')
                      p.write_text(s)
              else:
                  p.write_text(f'<resources>\n    <color name="splashscreen_background">{color}</color>\n</resources>\n')

          splash = Path("android/app/src/main/res/drawable/splashscreen.xml")
          if not splash.exists():
              splash.parent.mkdir(parents=True, exist_ok=True)
              splash.write_text(
                  '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <item android:drawable="@color/splashscreen_background"/>\n'
                  '</layer-list>\n'
              )

          print("Android splash resources verified.")
          PY

      - name: Stabilize generated Gradle configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          def resolve(name):
              return subprocess.check_output(
                  ["node", "-p", f"require.resolve('{name}')"],
                  text=True
              ).strip()

          def pkg_dir(name):
              return str(Path(resolve(name)).parent)

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("android/app/build.gradle was not generated")

          rn_dir = pkg_dir("react-native/package.json")
          codegen_dir = pkg_dir("@react-native/codegen/package.json")
          expo_cli = resolve("@expo/cli")

          replacements = {
              "entryFile =": 'entryFile = file(projectRoot + "/index.js")',
              "reactNativeDir =": f'reactNativeDir = file("{rn_dir}")',
              "hermesCommand =": f'hermesCommand = file("{rn_dir}/sdks/hermesc/%OS-BIN%/hermesc").getAbsolutePath()',
              "codegenDir =": f'codegenDir = file("{codegen_dir}")',
              "cliFile =": f'cliFile = file("{expo_cli}")',
          }

          lines = p.read_text().splitlines()
          found = set()

          for i, line in enumerate(lines):
              stripped = line.strip()
              for key, replacement in replacements.items():
                  if stripped.startswith(key):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[i] = indent + replacement
                      found.add(key)
                      break

          missing = set(replacements) - found
          if missing:
              raise SystemExit("Missing generated Expo Gradle settings: " + ", ".join(sorted(missing)))

          s = "\n".join(lines) + "\n"

          release = re.search(r"(?ms)(^\s*release\s*\{)(.*?)(^\s*\})", s)
          if not release:
              raise SystemExit("Could not find Android release build type")

          body = release.group(2)
          if "signingConfig signingConfigs." not in body:
              start, end = release.span(2)
              indent = re.match(r"\s*", release.group(1)).group(0) + "    "
              s = (
                  s[:start]
                  + "\n"
                  + indent
                  + "signingConfig signingConfigs.debug"
                  + s[start:end]
                  + s[end:]
              )

          p.write_text(s)

          print("Android Gradle configuration stabilized.")
          print("React Native:", rn_dir)
          print("Codegen:", codegen_dir)
          print("Expo CLI:", expo_cli)
          PY

      - name: Verify Android project
        shell: bash
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle
          test -f android/gradlew
          grep -n -E "entryFile =|reactNativeDir =|hermesCommand =|codegenDir =|cliFile =" android/app/build.gradle

      - name: Assemble APK
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://crickx-api.onrender.com/api/v1
          EXPO_PUBLIC_WEB_URL: https://crickx-3d806.web.app
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CrickX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrickX-Android-APK
          path: apps/mobile/dist/CrickX.apk
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "mobile-v1.0-$GITHUB_RUN_NUMBER" "dist/CrickX.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CrickX Android v1.0-$GITHUB_RUN_NUMBER" \
            --notes "Installable CrickX Android APK built from main."
