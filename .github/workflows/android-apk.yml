name: CrickX Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: .
        run: npm install --workspaces --include-workspace-root

      - name: Configure Node module resolution
        shell: bash
        run: |
          echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules:$GITHUB_WORKSPACE/apps/mobile/node_modules" >> "$GITHUB_ENV"

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Verify Node module resolution
        shell: bash
        run: |
          cd android
          node -e "console.log('expo=', require.resolve('expo/package.json')); console.log('react-native=', require.resolve('react-native/package.json')); console.log('codegen=', require.resolve('@react-native/codegen/package.json')); console.log('expo-cli=', require.resolve('@expo/cli/package.json'));"

      - name: Verify release signing
        shell: bash
        run: |
          grep -n -A8 -B3 'release {' android/app/build.gradle
          grep -q 'signingConfig signingConfigs.debug' android/app/build.gradle

      - name: Assemble APK
        shell: bash
        run: |
          test -f android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CrickX-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrickX-Android-APK-${{ github.run_number }}
          path: apps/mobile/dist/CrickX-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "mobile-v1.0.${{ github.run_number }}" "dist/CrickX-${{ github.run_number }}.apk" --repo "${{ github.repository }}" --title "CrickX Android v1.0.${{ github.run_number }}" --notes "Installable CrickX Android APK built from main."
