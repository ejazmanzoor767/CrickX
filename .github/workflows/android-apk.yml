name: CrickX Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: .
        run: npm install --workspaces --include-workspace-root

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Configure production APK signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Expo prebuild templates can change indentation/formatting between SDK versions.
          # Add a debug signing config to the release block only when one is not already present.
          build_types = re.search(r"(?ms)^\\s*buildTypes\\s*\\{.*?^\\s*\\}", s)
          if not build_types:
              raise SystemExit("Unable to find buildTypes block")

          block = build_types.group(0)
          release = re.search(r"(?ms)(^\\s*release\\s*\\{)(.*?)(^\\s*\\})", block)
          if not release:
              raise SystemExit("Unable to find release build type")

          release_body = release.group(2)
          if "signingConfig signingConfigs." not in release_body:
              indent = re.match(r"\\s*", release.group(1)).group(0) + "    "
              replacement = release.group(1) + "\\n" + indent + "signingConfig signingConfigs.debug" + release_body
              block = block[:release.start()] + replacement + block[release.end():]
              s = s[:build_types.start()] + block + s[build_types.end():]
              p.write_text(s)

          print("Release signing configuration ready.")
          PY

      - name: Assemble APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CrickX-\${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrickX-Android-APK-\${{ github.run_number }}
          path: apps/mobile/dist/CrickX-\${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release create "mobile-v1.0.\${{ github.run_number }}" "dist/CrickX-\${{ github.run_number }}.apk" \
            --repo "\${{ github.repository }}" \
            --title "CrickX Android v1.0.\${{ github.run_number }}" \
            --notes "Installable CrickX Android APK built from main."
