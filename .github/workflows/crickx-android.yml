name: CrickX Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crickx-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Validate and build CrickX Android
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: "1"
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/apps/mobile/node_modules
        run: npx expo prebuild --clean --platform android --no-install

      - name: Verify Android project
        working-directory: apps/mobile
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          chmod +x android/gradlew

      - name: Stabilize generated React Native Gradle paths
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def resolve(name):
              return subprocess.check_output(
                  ["node", "-p", f"require.resolve('{name}')"],
                  text=True,
              ).strip()

          def pkg_dir(name):
              return str(Path(resolve(name)).parent)

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("Generated android/app/build.gradle not found")

          rn_dir = pkg_dir("react-native/package.json")
          codegen_dir = pkg_dir("@react-native/codegen/package.json")
          hermes_compiler_dir = pkg_dir("hermes-compiler/package.json")
          expo_cli = resolve("@expo/cli")

          replacements = {
              "entryFile =": 'entryFile = file(projectRoot + "/index.js")',
              "reactNativeDir =": f'reactNativeDir = file("{rn_dir}")',
              "hermesCommand =": f'hermesCommand = file("{hermes_compiler_dir}/hermesc/%OS-BIN%/hermesc").getAbsolutePath()',
              "codegenDir =": f'codegenDir = file("{codegen_dir}")',
              "cliFile =": f'cliFile = file("{expo_cli}")',
          }

          lines = p.read_text().splitlines()
          found = set()
          for i, line in enumerate(lines):
              stripped = line.strip()
              for key, replacement in replacements.items():
                  if stripped.startswith(key):
                      indent = line[: len(line) - len(line.lstrip())]
                      lines[i] = indent + replacement
                      found.add(key)
                      break

          missing = set(replacements) - found
          if missing:
              raise SystemExit("Missing generated Expo Gradle settings: " + ", ".join(sorted(missing)))

          p.write_text("\n".join(lines) + "\n")
          print("React Native Gradle paths stabilized.")
          PY

      - name: Configure 16 KB Android native compatibility
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu images include the Android SDK, but sdkmanager is
          # not always on PATH. Resolve it from ANDROID_HOME explicitly.
          sdkmanager_bin=""
          for candidate in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager"; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -path '*/cmdline-tools/*/bin/sdkmanager' -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found. ANDROID_HOME=${ANDROID_HOME:-<unset>}" >&2
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 5 -name sdkmanager -type f -print 2>/dev/null || true
            exit 1
          fi

          "$sdkmanager_bin" "ndk;30.0.16248370" >/dev/null
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          new = "30.0.16248370"
          app_gradle = root / "app/build.gradle"

          if not app_gradle.exists():
              raise SystemExit("Generated android/app/build.gradle not found")

          text = app_gradle.read_text()

          # Expo generates an ndkVersion entry, but its value can vary by template.
          # Force the app module to the installed NDK r30 toolchain.
          updated, count = re.subn(
              r'(?m)^([ \t]*ndkVersion\s+).*$',
              r'\g<1>"' + new + '"',
              text,
              count=1,
          )
          if count == 0:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("Generated android/app/build.gradle has no android block")
              updated = text.replace(
                  marker,
                  marker + '\n    ndkVersion "' + new + '"',
                  1,
              )

          app_gradle.write_text(updated)

          # Verify the exact effective app-module NDK version.
          verify = app_gradle.read_text()
          if not re.search(r'(?m)^\s*ndkVersion\s+"' + re.escape(new) + r'"\s*$', verify):
              raise SystemExit("Failed to set android/app/build.gradle ndkVersion to " + new)

          manifest = root / "app/src/main/AndroidManifest.xml"
          manifest_text = manifest.read_text()
          if "android:pageSizeCompat=" not in manifest_text:
              marker = "<application "
              if marker not in manifest_text:
                  raise SystemExit("AndroidManifest.xml application element not found")
              manifest_text = manifest_text.replace(
                  marker,
                  '<application android:pageSizeCompat="enabled" ',
                  1,
              )
              manifest.write_text(manifest_text)

          print("Android app module configured for NDK r30:", new)
          print("Android 16 KB page-size compatibility fallback enabled.")
          PY

          grep -R "30.0.16248370" android --include='*.gradle' --include='*.kts' >/dev/null
          grep -q 'android:pageSizeCompat="enabled"' android/app/src/main/AndroidManifest.xml

      - name: Configure CI or production signing
        working-directory: apps/mobile
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          secrets_present=true
          for value in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD_SECRET ANDROID_KEY_ALIAS_SECRET ANDROID_KEY_PASSWORD_SECRET; do
            if [[ -z "${!value:-}" ]]; then
              secrets_present=false
            fi
          done

          if [[ "$secrets_present" == "true" ]]; then
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/crickx-release.keystore
            chmod 600 android/app/crickx-release.keystore
            test -s android/app/crickx-release.keystore
            {
              echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/apps/mobile/android/app/crickx-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
              echo "CRICKX_PRODUCTION_SIGNING=true"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v               -keystore android/app/crickx-ci.keystore               -storetype JKS               -storepass crickx-ci-password               -keypass crickx-ci-password               -alias crickx-ci               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=CrickX CI,O=CrickX"

            chmod 600 android/app/crickx-ci.keystore

            {
              echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/apps/mobile/android/app/crickx-ci.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=crickx-ci-password"
              echo "ANDROID_KEY_ALIAS=crickx-ci"
              echo "ANDROID_KEY_PASSWORD=crickx-ci-password"
              echo "CRICKX_PRODUCTION_SIGNING=false"
            } >> "$GITHUB_ENV"
          fi

      - name: Stabilize generated Gradle signing
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          store = os.environ["ANDROID_KEYSTORE_PATH"]
          if not store:
              raise SystemExit("ANDROID_KEYSTORE_PATH is empty")

          escaped_store = store.replace("\\", "\\\\").replace('"', '\\"')

          text = re.sub(
              r'(^\s*storeFile\s+file\()([^\n]*)(\)\s*$)',
              lambda m: m.group(1) + '"' + escaped_store + '"' + m.group(3),
              text,
              flags=re.MULTILINE,
          )

          if "crickxRelease {" not in text:
              anchor = "    signingConfigs {"
              if anchor not in text:
                  anchor = "        signingConfigs {"
              if anchor not in text:
                  raise SystemExit("Could not find signingConfigs block in generated Gradle file")

              block = (
                  "\n        crickxRelease {\n"
                  + '            storeFile file("' + escaped_store + '")\n'
                  + '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                  + '            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
                  + '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
                  + "        }\n"
              )
              text = text.replace(anchor, anchor + block, 1)

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.crickxRelease",
          )
          text = text.replace(
              "signingConfig signingConfigs.release",
              "signingConfig signingConfigs.crickxRelease",
          )

          # Keep the release APK broadly installable across Android package
          # installers by explicitly enabling legacy V1 plus modern V2/V3 signing.
          if "enableV1Signing true" not in text:
              marker = '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
              signing_lines = (
                  marker
                  + "            enableV1Signing true\n"
                  + "            enableV2Signing true\n"
                  + "            enableV3Signing true\n"
              )
              if marker not in text:
                  raise SystemExit("Could not find crickxRelease keyPassword line for APK signing flags")
              text = text.replace(marker, signing_lines, 1)

          path.write_text(text)
          print("Gradle release signing configured:", store)
          PY

      - name: Set unique Android version code
        working-directory: apps/mobile
        shell: bash
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()
          version_code = int(os.environ["ANDROID_VERSION_CODE"])
          if version_code < 1:
              raise SystemExit("Invalid Android version code")
          updated, count = re.subn(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Generated Gradle file did not contain exactly one versionCode")
          path.write_text(updated)
          print(f"Android versionCode set to {version_code}.")
          PY
      - name: Ensure Hermes compiler is executable
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$GITHUB_WORKSPACE/node_modules/hermes-compiler/hermesc"
          test -d "$hermes_root"
          find "$hermes_root" -type f -name hermesc -exec chmod 755 {} +
          hermes="$hermes_root/linux64-bin/hermesc"
          test -f "$hermes"
          test -x "$hermes"
          file "$hermes"
          "$hermes" --version >/dev/null

      - name: Configure reliable native library packaging
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "useLegacyPackaging true" not in text:
              marker = "    packagingOptions {"
              if marker in text:
                  insertion = (
                      marker + "\n"
                      "        jniLibs {\n"
                      "            useLegacyPackaging true\n"
                      "        }\n"
                  )
                  text = text.replace(marker, insertion, 1)
              else:
                  android_marker = "android {"
                  if android_marker not in text:
                      raise SystemExit("Could not find android block in generated Gradle file")
                  block = (
                      android_marker + "\n"
                      "    packagingOptions {\n"
                      "        jniLibs {\n"
                      "            useLegacyPackaging true\n"
                      "        }\n"
                      "    }"
                  )
                  text = text.replace(android_marker, block, 1)

          path.write_text(text)
          print("JNI libraries configured for compressed APK packaging.")
          PY

      - name: Build release APK
        working-directory: apps/mobile
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://crickx-api.onrender.com/api/v1
          EXPO_PUBLIC_WEB_URL: https://crickxfantasy.site
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

      - name: Validate APK package and signature
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"
          test -x "$apksigner"
          test -x "$aapt2"
          "$apksigner" verify --verbose "$apk"
          "$aapt2" dump badging "$apk" | grep -E "^package: name='com\.crickx\.app'"
          echo "Native ABIs packaged in APK:"
          unzip -Z1 "$apk" | grep -E '^lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/' | cut -d/ -f2 | sort -u
          echo "Native libraries are packaged compressed for installer compatibility."
          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 "$apk" | grep -q "^lib/${abi}/" || { echo "Missing required phone ABI: ${abi}"; exit 1; }
          done
          echo "APK package, ZIP structure, signature, and ARM phone ABIs verified."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrickX-Android-release-validation
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish build metadata
        working-directory: apps/mobile
        run: |
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          echo "Production signing: ${CRICKX_PRODUCTION_SIGNING:-false}"
      - name: Publish GitHub release APK (every main build)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          if [[ "${CRICKX_PRODUCTION_SIGNING:-false}" == "true" ]]; then
            tag="android-v${GITHUB_RUN_NUMBER}"
            title="CrickX Android v${GITHUB_RUN_NUMBER}"
            notes="Automated CrickX Android APK release from commit ${GITHUB_SHA}. Production signing is enabled."
          else
            tag="android-ci-v${GITHUB_RUN_NUMBER}"
            title="CrickX Android v${GITHUB_RUN_NUMBER} (CI-signed)"
            notes="Automated CrickX Android validation APK from commit ${GITHUB_SHA}. This build is CI-signed because production Android signing secrets are not configured. Use it for testing; configure the production keystore before distributing it as the long-term production APK."
          fi

          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes "$notes"
