name: CrickX Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/crickx-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crickx-android
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund

      - name: Configure Node resolution
        run: echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules:$GITHUB_WORKSPACE/apps/mobile/node_modules" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --clean --platform android --no-install

      - name: Ensure Android splash resources
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          color = "#0B0D12"
          for folder in [
              Path("android/app/src/main/res/values"),
              Path("android/app/src/main/res/values-night"),
          ]:
              folder.mkdir(parents=True, exist_ok=True)
              p = folder / "colors.xml"
              if p.exists():
                  text = p.read_text()
                  if 'name="splashscreen_background"' not in text:
                      p.write_text(text.replace(
                          "</resources>",
                          f'    <color name="splashscreen_background">{color}</color>\n</resources>'
                      ))
              else:
                  p.write_text(
                      f'<resources>\n    <color name="splashscreen_background">{color}</color>\n</resources>\n'
                  )

          splash = Path("android/app/src/main/res/drawable/splashscreen.xml")
          if not splash.exists():
              splash.parent.mkdir(parents=True, exist_ok=True)
              splash.write_text(
                  '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <item android:drawable="@color/splashscreen_background"/>\n'
                  '</layer-list>\n'
              )
          PY

      - name: Configure release signing
        working-directory: apps/mobile
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" || {
            echo "Missing required GitHub secret: ANDROID_RELEASE_KEYSTORE_BASE64"
            exit 1
          }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/crickx-release.keystore
          chmod 600 android/app/crickx-release.keystore
          test -s android/app/crickx-release.keystore

      - name: Stabilize generated Gradle configuration
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def resolve(name):
              return subprocess.check_output(
                  ["node", "-p", f"require.resolve('{name}')"],
                  text=True
              ).strip()

          def pkg_dir(name):
              return str(Path(resolve(name)).parent)

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("android/app/build.gradle was not generated")

          rn_dir = pkg_dir("react-native/package.json")
          codegen_dir = pkg_dir("@react-native/codegen/package.json")
          expo_cli = resolve("@expo/cli")

          replacements = {
              "entryFile =": 'entryFile = file(projectRoot + "/index.js")',
              "reactNativeDir =": f'reactNativeDir = file("{rn_dir}")',
              "hermesCommand =": f'hermesCommand = file("{rn_dir}/sdks/hermesc/%OS-BIN%/hermesc").getAbsolutePath()',
              "codegenDir =": f'codegenDir = file("{codegen_dir}")',
              "cliFile =": f'cliFile = file("{expo_cli}")',
          }

          lines = p.read_text().splitlines()
          found = set()
          for i, line in enumerate(lines):
              stripped = line.strip()
              for key, replacement in replacements.items():
                  if stripped.startswith(key):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[i] = indent + replacement
                      found.add(key)
                      break

          missing = set(replacements) - found
          if missing:
              raise SystemExit(
                  "Missing generated Expo Gradle settings: "
                  + ", ".join(sorted(missing))
              )

          text = "\n".join(lines) + "\n"
          anchor = "    signingConfigs {"
          if anchor not in text:
              anchor = "        signingConfigs {"
          if anchor not in text:
              raise SystemExit("Could not find Android signingConfigs block")

          signing_block = """
        crickxRelease {
            storeFile file("crickx-release.keystore")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
"""
          text = text.replace(anchor, anchor + signing_block, 1)

          token = "signingConfig signingConfigs.debug"
          positions = [i for i in range(len(text)) if text.startswith(token, i)]
          if not positions:
              raise SystemExit("Could not find generated release signing configuration")

          idx = positions[-1]
          text = text[:idx] + "signingConfig signingConfigs.crickxRelease" + text[idx + len(token):]
          p.write_text(text)
          PY

      - name: Verify generated Android project
        working-directory: apps/mobile
        run: |
          test -f android/app/build.gradle
          test -f android/gradlew
          grep -n -E "entryFile =|reactNativeDir =|hermesCommand =|codegenDir =|cliFile =" android/app/build.gradle

      - name: Assemble release APK
        working-directory: apps/mobile
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
          EXPO_PUBLIC_API_BASE_URL: https://crickx-api.onrender.com/api/v1
          EXPO_PUBLIC_WEB_URL: https://crickx-3d806.web.app
          EXPO_PUBLIC_FIREBASE_API_KEY: "${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}"
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrickX-Android-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "mobile-v1.0-$GITHUB_RUN_NUMBER"             "apps/mobile/android/app/build/outputs/apk/release/app-release.apk"             --repo "$GITHUB_REPOSITORY"             --title "CrickX Android v1.0-$GITHUB_RUN_NUMBER"             --notes "Installable CrickX Android APK built from main."
