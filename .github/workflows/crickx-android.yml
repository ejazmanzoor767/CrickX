name: CrickX Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Validate and build CrickX Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: "1"
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/apps/mobile/node_modules
        run: npx expo prebuild --clean --platform android --no-install

      - name: Verify Android project
        working-directory: apps/mobile
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          chmod +x android/gradlew

      - name: Build release APK
        working-directory: apps/mobile
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://crickx-api.onrender.com/api/v1
          EXPO_PUBLIC_WEB_URL: https://crickx-3d806.web.app
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrickX-Android-unsigned-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish build metadata
        run: |
          sha256sum apps/mobile/android/app/build/outputs/apk/release/app-release.apk
