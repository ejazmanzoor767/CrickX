name: Temporary dependency lock refresh

on:
  push:
    branches:
      - feature/multi-wallet-connect
    paths:
      - "package.json"
      - ".github/workflows/refresh-feature-lock.yml"

permissions:
  contents: write

concurrency:
  group: crickx-multi-wallet-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          rm -rf node_modules apps/*/node_modules
          rm -f package-lock.json
          npm install --package-lock-only --workspaces --include-workspace-root --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(web3): refresh dependency lockfile"
          git push origin HEAD:"${GITHUB_REF_NAME}"
