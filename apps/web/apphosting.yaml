runConfig:
  maxInstances: 1
  minInstances: 0
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# The public API URL is intentionally configured in Firebase App Hosting
# environment settings rather than hard-coded into application code.
env:
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://pitchxi-secure.onrender.com/api/v1
    availability:
      - BUILD
      - RUNTIME
